<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080611">
<title>Navi chat</title>
<style>
:root{color-scheme:dark;--bg:#080611;--panel:#131020;--panel2:#1b1530;--purple:#9b4dff;--pink:#e15bff;--text:#f7f2ff;--muted:#aaa0c2;--line:#302447}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#20103d 0,#080611 48%);color:var(--text);font:16px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh;display:flex;justify-content:center}
.app{width:100%;max-width:760px;min-height:100vh;display:flex;flex-direction:column;padding:16px}
header{display:flex;align-items:center;gap:12px;padding:12px 4px 18px;border-bottom:1px solid var(--line)}
.logo{width:52px;height:52px;flex:none;filter:drop-shadow(0 0 12px #a333ff88)}
h1{font-size:22px;margin:0;letter-spacing:.2px} .sub{font-size:12px;color:var(--muted);margin-top:3px}
.status{margin-left:auto;font-size:12px;color:#bba8d9;background:#201631;border:1px solid #40265e;padding:7px 10px;border-radius:99px}
.notice{margin:14px 0;padding:12px 14px;background:#171225;border:1px solid var(--line);border-radius:14px;color:var(--muted);font-size:13px;line-height:1.5}
#messages{flex:1;min-height:260px;display:flex;flex-direction:column;gap:10px;padding:10px 0 18px}
.empty{color:var(--muted);text-align:center;margin:auto;padding:30px 16px;line-height:1.6}
.msg{max-width:88%;align-self:flex-start;background:var(--panel2);border:1px solid #38264f;border-radius:16px 16px 16px 5px;padding:10px 13px;overflow-wrap:anywhere}
.msg.mine{align-self:flex-end;background:linear-gradient(135deg,#54219a,#7827a4);border-color:#9c4be1;border-radius:16px 16px 5px 16px}
.meta{display:flex;gap:12px;color:#d0b8ed;font-size:11px;margin-bottom:4px}.body{white-space:pre-wrap;line-height:1.45}
form{display:flex;gap:8px;padding:12px 0 max(8px,env(safe-area-inset-bottom));border-top:1px solid var(--line)}
input{min-width:0;flex:1;background:#171225;color:var(--text);border:1px solid #403054;border-radius:15px;padding:14px;font:inherit;outline:none}
input:focus{border-color:var(--purple);box-shadow:0 0 0 3px #9b4dff22}
button{border:0;border-radius:15px;padding:0 18px;background:linear-gradient(135deg,#883bff,#d13bdb);color:white;font-weight:700;font-size:15px}
button:disabled{opacity:.5}
footer{text-align:center;color:#74688b;font-size:11px;padding:4px 0 10px}
@media(min-width:600px){.app{padding:22px}.msg{max-width:75%}}
</style>
</head>
<body>
<div class="app">
<header>
<svg class="logo" viewBox="0 0 100 100" aria-label="Navi chat logo">
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fa8bff"/><stop offset=".48" stop-color="#a53cff"/><stop offset="1" stop-color="#5520ff"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<circle cx="47" cy="46" r="30" fill="#10091f" stroke="url(#g)" stroke-width="3" filter="url(#glow)"/>
<ellipse cx="50" cy="50" rx="44" ry="20" transform="rotate(-25 50 50)" fill="none" stroke="url(#g)" stroke-width="5" stroke-linecap="round" stroke-dasharray="180 95" filter="url(#glow)"/>
<rect x="36" y="37" width="6" height="18" rx="3" fill="#e8b6ff" filter="url(#glow)"/><rect x="54" y="37" width="6" height="18" rx="3" fill="#e8b6ff" filter="url(#glow)"/>
</svg>
<div><h1>Navi chat</h1><div class="sub">Общий чат · версия для тестирования</div></div>
<div class="status" id="status">Подключение…</div>
</header>
<div class="notice" id="notice">Подключаемся к чату. Для работы включите Anonymous (анонимную) авторизацию в Firebase Console → Authentication → Sign-in method.</div>
<section id="messages" aria-live="polite"><div class="empty" id="empty">💜<br>Пока сообщений нет.<br>Напиши первое сообщение!</div></section>
<form id="form"><input id="message" maxlength="1000" autocomplete="off" placeholder="Написать сообщение…" aria-label="Сообщение"><button id="send" type="submit" disabled>Отправить</button></form>
<footer>Не отправляй пароли, адреса или личные данные в тестовом чате.</footer>
</div>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyB29x6IFNMH9OIxLIiGZIPoSWxup9tL9xg",
  authDomain: "navi-chat-ced31.firebaseapp.com",
  databaseURL: "https://navi-chat-ced31-default-rtdb.firebaseio.com",
  projectId: "navi-chat-ced31",
  storageBucket: "navi-chat-ced31.firebasestorage.app",
  messagingSenderId: "742584435955",
  appId: "1:742584435955:web:300edf71e4b08b36f22386",
  measurementId: "G-XFYH20VC4E"
};
const statusEl=document.getElementById('status');
const notice=document.getElementById('notice');
const messagesEl=document.getElementById('messages');
const empty=document.getElementById('empty');
const input=document.getElementById('message');
const send=document.getElementById('send');
let currentUser=null, db=null;
function showError(message){notice.textContent=message;notice.style.color='#ffb6c2';}
function addMessage(data){
  if(empty) empty.remove();
  const item=document.createElement('article');
  item.className='msg'+(data.uid===currentUser?.uid?' mine':'');
  const meta=document.createElement('div');meta.className='meta';
  const name=document.createElement('span');name.textContent=data.uid===currentUser?.uid?'Ты':'Пользователь';
  const time=document.createElement('span');
  time.textContent=typeof data.createdAt==='number'?new Date(data.createdAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):'сейчас';
  const body=document.createElement('div');body.className='body';body.textContent=String(data.text||'');
  meta.append(name,time);item.append(meta,body);messagesEl.append(item);
  messagesEl.scrollTop=messagesEl.scrollHeight;
}
try{
  firebase.initializeApp(firebaseConfig);
  db=firebase.database();
  firebase.auth().signInAnonymously().then(cred=>{
    currentUser=cred.user;
    statusEl.textContent='В сети';
    notice.textContent='Ты вошёл в общий тестовый чат. Сообщения видны всем пользователям, которые вошли в этот чат.';
    send.disabled=false;
    db.ref('messages').limitToLast(100).on('child_added',snap=>addMessage(snap.val()),err=>{
      showError('Не удалось прочитать сообщения. Проверь Rules в Realtime Database и включена ли Anonymous-авторизация.');
      statusEl.textContent='Ошибка доступа';
    });
  }).catch(err=>{
    statusEl.textContent='Не подключено';
    showError('Не удалось войти: '+err.message+'. В Firebase открой Authentication → Sign-in method и включи Anonymous, затем проверь правила Realtime Database.');
  });
}catch(e){statusEl.textContent='Ошибка';showError('Firebase не запустился: '+e.message);}
document.getElementById('form').addEventListener('submit',async e=>{
  e.preventDefault();const text=input.value.trim();
  if(!text||!currentUser||!db)return;
  send.disabled=true;
  try{await db.ref('messages').push({text,uid:currentUser.uid,createdAt:firebase.database.ServerValue.TIMESTAMP});input.value='';}
  catch(err){showError('Сообщение не отправлено. Проверь правила базы данных и авторизацию.');}
  finally{send.disabled=false;input.focus();}
});
</script>
</body>
</html>
